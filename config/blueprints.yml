# What it costs to unlock a blueprint, and what you must have done first.
#
# **This is delivery-tier data and it must stay out of `content/`.** That YAML is the
# simulation's own, read by `content.rb` at boot, and the simulation has no concept of value and
# must not acquire one — it would be the first field in there existing solely for Rails. See
# `docs/design_sketches/blueprints.md` §7.
#
# It is also the one part of the blueprint system that genuinely *is* data rather than code.
# Part behaviour is a builder block and stays in `parts.rb` beside the sweeps that chose its
# numbers (`modular_components.md` §3); a bill of materials is scalars with no logic that will be
# rebalanced constantly, and a rebalance should not be a change to `lib/reactor_sim` requiring
# both dev processes restarted.
#
# ## Rules
#
#   * **Every blueprint needs an entry.** A missing one is an error at catalogue build, not a
#     free part — `content_spec` already refuses a structural material with no temperature
#     rating for the same reason: a default of zero is a silent off switch.
#   * **`materials: {}` means genuinely free**, and has to be written out. That is the difference
#     between "decided to be free" and "nobody filled it in".
#   * **Material names are resource ids the simulation knows** (`content/resources/`), checked at
#     catalogue build: the metals in `materials.yml`, and anything else a part is made of, such as
#     a conveyor's belting. Quantities are kilograms.
#   * **`requires` names an achievement** (`Achievement.known`, derived from the definitions in
#     `app/models/achievement.rb`), also checked. Optional — and no longer decorative: the gate
#     reads the `awards` table, so a blueprint naming one is genuinely locked until it is earned.
#
# ## The numbers are provisional and are meant to look it
#
# Nothing can pay these yet: there is no resource ledger, because a match reward cannot be
# designed against a single steam engine — the mechanic is one operation's failure starving
# another's input (`blueprints.md` §4). These are plausible masses for the thing described, not
# balanced prices, and they exist so the *shape* is right before anything depends on it.

operation:
  # The starting machine. Free by definition — a player who cannot assemble anything has no
  # opening screen. Which things are free is what defines the bottom tier every later choice is
  # measured against, and that tier is still to be designed.
  steam_engine:
    materials: {}
  # The second operation. Not free: a mine is a hole somebody paid to sink, and it is the first
  # thing a player buys with what the engine earned.
  mine:
    materials:
      wrought_iron: 3200
      cast_iron: 1800

chassis:
  # The frame itself: bedplate, framing, the housing everything else bolts to. Watt's is the
  # heavier of the two because a beam engine is a building with an engine in it.
  steam_engine/atmospheric:
    materials:
      cast_iron: 9000
      wrought_iron: 2500
  steam_engine/high_pressure:
    materials:
      cast_iron: 4200
      wrought_iron: 1800
  # The starting pit: one shaft, with both halves of the air in it.
  mine/single_shaft:
    materials:
      wrought_iron: 2600
      steel: 400
  # Two shafts, because after Hartley one is not lawful and not survivable. The cost is the
  # second shaft — the frame of a colliery is the hole itself.
  mine/two_shaft:
    materials:
      wrought_iron: 5400
      steel: 900

# **You unlock the person.** This said the opposite for a release — "you unlock the template,
# never the person" — and it was wrong along with everything else that enumerated `fireman` and
# `yardhand`, which are jobs rather than people. Health, fatigue, station and injury are still
# minted fresh inside each match and die with it, exactly as a part's condition does; what
# persists is who you have hired, what they have been trained in, and what kit they own.
#
# Free because a crew is not built out of metal. What hiring somebody should actually cost —
# wages, reputation, an achievement — is a question for whenever minions do real work.
minion:
  jim:
    materials: {}
  elowynne:
    materials: {}
  galathas:
    materials: {}
  throg:
    materials: {}

# **Priced by the ITEM, not by the (minion, item) pair.** Ownership is per minion — Jim's apron
# and Elowynne's apron are two separate unlocks with ids `jim/leather_apron` and
# `elowynne/leather_apron` — but an apron costs what an apron costs, whoever it is cut for.
#
# Pricing the pair would mean one line here for every combination: 39 today, every one identical,
# and a fresh row needed the moment anybody hires a fourth minion. That is precisely the
# inventory list that drifts silently. `Blueprint.build` takes `priced_as:` for it.
equipment:
  stokers_shovel:
    materials: { steel: 3, wrought_iron: 1 }
  gauge_spanner:
    materials: { steel: 2 }
  oil_can:
    materials: { steel: 1, bronze: 1 }
  crude_miners_tools:
    materials: { steel: 2, wrought_iron: 2 }
  # The step that turns hewing from hopeless into a job. Steel rather than a shaped stone, and
  # a lamp that shows you the face.
  miners_tools:
    materials: { steel: 9, wrought_iron: 3, bronze: 1 }
  # Gauze, and the reason it costs more than the oil lamp it replaces is that it is the only
  # one that will not fire the district.
  davy_lamp:
    materials: { wrought_iron: 2, bronze: 3 }
  # Canvas and two poles, so it is nearly free to make — the cost of a stretcher is that the hand
  # holding it is not holding a pick, which the tool slot charges and no bill needs to.
  stretcher:
    materials: { wrought_iron: 1 }
  # Dear, and it should be: a cylinder that will hold pressure is the expensive part, and this
  # is the only kit in the game that buys a minute of somewhere they could not otherwise stand.
  rescue_apparatus:
    materials: { steel: 14, bronze: 6, wrought_iron: 4 }
  leather_apron:
    materials: {}
  # Hardened leather with a steel band: cheap, and the first kit that answers a falling stone.
  pit_helmet:
    materials: { steel: 1 }
  safety_belt:
    materials: { wrought_iron: 1, steel: 1 }
  fettlers_gloves:
    materials: {}
  oilskin_coat:
    materials: {}
  asbestos_suit:
    materials: {}
  ear_defenders:
    materials: {}
  # Gated: you do not go down a hole with a lamp until you have raised steam above ground.
  hand_lamp:
    materials: { bronze: 2, steel: 1 }
    requires: first_full_head_of_steam
  lucky_amulet:
    materials: { bronze: 1 }
    requires: burst_a_flywheel

# Training is bought with time rather than metal, so every one of these is free of materials and
# gated on having actually done the thing instead. That is the shape a course *should* have: you
# cannot certify somebody for hot work in a shop that has never raised steam.
training:
  hot_work_ticket:
    materials: {}
    requires: first_full_head_of_steam
  boilermans_course:
    materials: {}
    requires: raised_steam_from_cold_alone
  steady_hands:
    materials: {}
  strong_back:
    materials: {}
  pit_sense:
    materials: {}
    requires: ran_an_hour_without_blowing_off
  winding_ticket:
    materials: {}
  shotfirers_ticket:
    materials: {}

part:
  # --- fire -------------------------------------------------------------------------------
  stock_firebox:
    materials:
      wrought_iron: 1400
      cast_iron: 600        # firebars, which are cast because they live in the fire
  stock_ash_pan:
    materials:
      wrought_iron: 180
  wide_damper:
    materials:
      cast_iron: 140
  narrow_damper:
    materials:
      cast_iron: 110
  stock_stoker:
    materials:
      steel: 90
  stock_bunker:
    materials:
      wrought_iron: 700
  # The drum and its first fill. The oil is priced with the vessel because a store arrives full —
  # an empty one would be a part that does nothing until a second purchase nobody was told about.
  stock_oil_store:
    materials:
      wrought_iron: 90
      bearing_oil: 180
  babbitt_journals:
    materials:
      bronze: 34
      babbitt: 11
  # Bronze shells take neglect white metal will not, and score the crank when they finally go.
  # Gated behind a long clean run, because the point of them is tolerance and a player who has
  # not yet held an engine steady for an hour has no use for it.
  bronze_journals:
    materials:
      bronze: 96
    requires: ran_an_hour_without_blowing_off
  # The late one. Expensive in steel, and it retires the oil round for the journals entirely.
  roller_bearings:
    materials:
      steel: 140
      bronze: 18
    requires: raised_steam_from_cold_alone
  # A can, two pipes and a funnel. The cheapest thing in the catalogue, because what it actually
  # costs is a person standing at it instead of at the shovel.
  hand_oiling:
    materials:
      bronze: 6
      wrought_iron: 4
  # **A bench, a stove and a roof — and it is where every hand you bring starts the shift.**
  # Timber and iron rather than machinery, so it is cheap; what a better one buys is another pair
  # of hands and a shorter rest, which is why the upgrade chain hangs off this slot rather than
  # off any of the machine's.
  mess_room:
    materials:
      wrought_iron: 40
      cast_iron: 25
  # What it buys is a person back. Priced against that rather than against its bill of materials.
  ring_oiler:
    materials:
      bronze: 34
      wrought_iron: 22
    requires: first_full_head_of_steam
  # **The starting blower, and cheap because what it costs is a person.** Leather and ash: the
  # bill of materials is nearly nothing and the price is paid every second somebody is on the
  # handles instead of on the shovel.
  hand_bellows:
    materials:
      wrought_iron: 12
  # **The upgrade that buys the person back.** Gated: an engine is what earns you the right to a
  # second engine, and until then raising steam is something you do by hand.
  donkey_blower:
    materials:
      cast_iron: 220
      bronze: 40
      steel: 60
    requires: first_full_head_of_steam

  # --- the boiler and what protects it ------------------------------------------------------
  locomotive_boiler:
    materials:
      wrought_iron: 3200
      cast_iron: 300
  beam_boiler:
    materials:
      wrought_iron: 4600    # wider, thinner, and a great deal more of it
      cast_iron: 400
  stock_boiler_tubes:
    # The single biggest upgrade on the engine, and a great many small tubes.
    materials:
      wrought_iron: 850
  stock_fusible_plug:
    # Almost nothing, and it is the difference between a bad day and a destroyed boiler.
    materials:
      fusible_alloy: 3
      bronze: 6
  ramsbottom_safety_valve:
    materials:
      bronze: 34
      steel: 12
    requires: first_full_head_of_steam
  low_pressure_safety_valve:
    materials:
      bronze: 28
      steel: 8

  # **Instruments are parts too, and they cost almost nothing to make.** That is the whole
  # difficulty of pricing them: a Bourdon gauge is a curled brass tube and a pointer, so the bill
  # of materials cannot be what makes a better one expensive. Whatever eventually gates an
  # instrument upgrade — an achievement, a craftsman, a certification — it will not be tonnage.
  bourdon_pressure_gauge:
    materials:
      bronze: 4
      steel: 2
  low_pressure_gauge:
    materials:
      bronze: 4
      steel: 2
  compensated_pressure_gauge:
    materials:
      bronze: 6
      steel: 3
    requires: ran_an_hour_without_blowing_off

  # The water gauges. Same pricing difficulty as the pressure dials and the same answer: a sight
  # glass is a tube and two cocks, so the bill of materials cannot carry the progression. What
  # separates these is what you had to *do* to earn the right to fit one.
  #
  # Try-cocks are free and starting kit: the older way of reading the water, and the tier every
  # new operation begins on.
  # (No `glass` material: `materials.yml` entries carry tensile strength and density because the
  # physics reads them, so inventing one to express a shopping cost would put an unrated
  # structural material in the registry. The brasswork is the part that is actually made.)
  try_cocks:
    materials: {}
  gauge_glass:
    materials:
      bronze: 3
      steel: 1
  reflex_gauge_glass:
    materials:
      bronze: 4
      steel: 2
    requires: raised_steam_from_cold_alone

  # --- water ------------------------------------------------------------------------------
  stock_water_supply:
    materials:
      wrought_iron: 950
  stock_injector:
    materials:
      bronze: 70
      steel: 25

  # --- steam ------------------------------------------------------------------------------
  stock_regulator:
    materials:
      bronze: 55
      steel: 20
  stock_steam_chest:
    materials:
      cast_iron: 310
  blastpipe_chimney:
    # Stack and blast nozzle were proportioned together and are one assembly, which is why this
    # is a chimney variant rather than two blueprints.
    materials:
      wrought_iron: 1100
      cast_iron: 150
    requires: raised_steam_from_cold_alone
  plain_chimney:
    materials:
      wrought_iron: 900
  stock_condenser:
    materials:
      cast_iron: 1600
      bronze: 120

  # --- the engine ---------------------------------------------------------------------------
  high_pressure_cylinder:
    materials:
      cast_iron: 620
      bronze: 45          # valve faces, which have to slide against iron and lose
    requires: first_full_head_of_steam
  atmospheric_cylinder:
    materials:
      cast_iron: 2400
      bronze: 60
  high_pressure_cylinder_relief:
    materials:
      bronze: 22
      steel: 7
  low_pressure_cylinder_relief:
    materials:
      bronze: 18
      steel: 6
  stock_drain_cocks:
    materials:
      bronze: 14
  light_flywheel:
    materials:
      cast_iron: 2600
      babbitt: 12         # the bearings it turns in, which are meant to be what wears out
  beam_flywheel:
    materials:
      cast_iron: 11000
      babbitt: 30
  mill_drive:
    materials:
      cast_iron: 800
      steel: 260
      babbitt: 18
  slow_mill_drive:
    materials:
      cast_iron: 1100
      steel: 180
      babbitt: 22

  # --- the mine ---------------------------------------------------------------------------
  # Priced against the engine's fittings rather than against each other: a colliery's plant is
  # heavier than a locomotive's because everything has to hold a shaft open against the ground.
  hand_picks:
    materials:
      steel: 40           # a rack of picks and wedges, and little else
  coal_cutter:
    materials:
      steel: 1400
      cast_iron: 900
      babbitt: 22
  # Haulage. Putting is tubs and rails, which every pit has; a rope haulage is an engine, its drum
  # and a thousand yards of wire rope.
  hand_putting:
    materials: {}
  rope_haulage:
    materials:
      steel: 900
      cast_iron: 700
      wrought_iron: 300
  # Ventilating furnaces: firebars and their bearers, by the grate. The brickwork is the pit's own
  # labour and no material in the catalogue. A dumb drift is a drift and its doors.
  fire_basket:
    materials:
      wrought_iron: 120
  brick_furnace:
    materials:
      cast_iron: 600
      wrought_iron: 200
  double_furnace:
    materials:
      cast_iron: 1200
      wrought_iron: 400
  dumb_drift:
    materials:
      wrought_iron: 60
  # Cutter sprays: a small pump, a pipe range up the road and bronze jets.
  water_sprays:
    materials:
      steel: 120
      bronze: 15
  # Runaway catches: a sprung set of points, or a backstay for every set.
  catch_points:
    materials:
      steel: 150
  drags:
    materials:
      wrought_iron: 220
  # A belt conveyor is a drive head, idlers the length of the road and the belt itself; the
  # fire-resistant one is the same structure with PVC belting.
  belt_conveyor:
    materials:
      steel: 2200
      cast_iron: 900
      belting: 4000
  fire_resistant_conveyor:
    materials:
      steel: 2200
      cast_iron: 900
      fire_resistant_belting: 4000
  # Shotfiring: drills, tamping bars and a magazine. The permitted kind costs more for the same
  # coal, and what it buys is a flame that does not fire the district.
  powder_shots:
    materials:
      steel: 60
      wrought_iron: 30
  permitted_shots:
    materials:
      steel: 60
      wrought_iron: 30
      copper: 20          # the electric firing it was used with
  # The hoist. A whim is a drum, a rope and a bucket; a cage is the same drum with steel guides
  # and a deck, which is where the steel goes.
  steam_whim:
    materials:
      cast_iron: 1600
      wrought_iron: 900
      babbitt: 20
  # Man riding. A man engine is mostly pitch pine — a rod the depth of the shaft — which is why it
  # is cheaper than the cages it competes with for the shift's time.
  man_engine:
    materials:
      wrought_iron: 700
      cast_iron: 900
      babbitt: 18
  # The same rods, and a catch at every sollar.
  caught_man_engine:
    materials:
      wrought_iron: 900
      cast_iron: 1000
      babbitt: 18
  cage_gear:
    materials:
      steel: 1900
      cast_iron: 1100
      babbitt: 26
  # A forged hook and a catch plate in the headframe: little iron, and it saves the cage.
  hooked_cage:
    materials:
      steel: 2100
      cast_iron: 1300
      babbitt: 26
  tripped_cage:
    materials:
      steel: 2300
      cast_iron: 1500
      bronze: 40
      babbitt: 30
  # The winding rope, by what it is made of and what ninety metres of it weighs. Hemp is free:
  # it is what every pit starts on, and there is no hemp in the content to price it in.
  hemp_rope:
    materials: {}
  iron_wire_rope:
    materials:
      wrought_iron: 500
  steel_wire_rope:
    materials:
      steel: 520
  # The reversible fan is a Guibal with a set of iron reversing doors in its drift.
  reversible_fan:
    materials:
      cast_iron: 4200
      wrought_iron: 1800
      wood: 600
  # The headframe: a pitch-pine frame every pit starts with, and the iron one that will not burn.
  timber_headframe:
    materials:
      wood: 4000
  iron_headframe:
    materials:
      wrought_iron: 6000
  # A whole second rope, of whatever kind is fitted, for something that does nothing until the
  # day it is needed.
  spare_rope:
    materials:
      steel: 1400
  shaft_gates:
    materials:
      wood: 120
      cast_iron: 80
  # Flyweights and a trip lever: small, precise, and it is the bronze that costs.
  overspeed_trip:
    materials:
      steel: 30
      bronze: 15
  electric_bells:
    materials:
      steel: 20
  flameproof_bells:
    materials:
      steel: 20
      cast_iron: 60
  waddle_fan:
    materials:
      wrought_iron: 1500
      cast_iron: 400
  guibal_fan:
    materials:
      cast_iron: 3800     # the spiral casing, which is most of why it is better
      wrought_iron: 2100
      babbitt: 26
  sinking_set:
    materials:
      cast_iron: 900
      bronze: 60          # bucket and clack seats, because pit water eats iron
  cornish_set:
    materials:
      cast_iron: 4200
      wrought_iron: 1400
      bronze: 140
  lamp_cabin:
    materials:
      wrought_iron: 240
  pit_head_baths:
    materials:
      wrought_iron: 900
      cast_iron: 500
  # Lighting. Tallow and oil are cheap because what they cost is paid somewhere else.
  tallow_candles:
    materials:
      wood: 20
  oil_flares:
    materials:
      wrought_iron: 70
      wood: 30
  gauze_lanterns:
    materials:
      wrought_iron: 180
      bronze: 40
  # A dynamo, a run of cable and a lamp every twenty yards.
  electric_lamps:
    materials:
      copper: 420
      wrought_iron: 300
      steel: 160
  # A hole cut in the side of a roadway is labour and a few props, which is why it is the one
  # a pit starts with.
  refuge_hole:
    materials:
      wood: 90
  snap_cabin:
    materials:
      wood: 340
      wrought_iron: 120
  pit_bottom_refuge:
    materials:
      wood: 90
  # Who is already down when the match starts. The starting arrangements are how the pit works,
  # not a thing it builds; the upgrades are a cabin at the face and a stable at the pit bottom.
  advance_shift:
    materials: {}
  pit_bottom_shift:
    materials: {}
  back_shift:
    materials:
      wood: 260
      wrought_iron: 40
  underground_stable:
    materials:
      wood: 420
      wrought_iron: 60
  # The haulage door. Wood and a hinge; what costs is hanging it so it shuts itself, and twice.
  plain_door:
    materials: {}
  self_closing_door:
    materials:
      wood: 60
      wrought_iron: 20
  air_lock:
    materials:
      wood: 140
      wrought_iron: 50
  # Brattices. What one is made of is what it leaks; what it does when it comes down is later.
  canvas_brattice:
    materials:
      wood: 120
  creosoted_brattice:
    materials:
      wood: 160
  timber_brattice:
    materials:
      wood: 900
  concrete_brattice:
    materials:
      stone_dust: 2400
      steel: 300
  sparse_manholes:
    materials:
      wood: 160
  whitewashed_manholes:
    materials:
      wood: 420
      stone_dust: 60
