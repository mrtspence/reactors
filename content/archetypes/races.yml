# What a minion IS, as opposed to who they are.
#
# An archetype is a kind of person — a race — and it is the **first baseline layer** of four:
#
#   1. archetype   this file. What every member of that race starts from.
#   2. individual  content/minions/. Who they are — offsets and tags of their own, so Elowynne
#                  and Galathas are both elves and are not the same worker.
#   3. training    a permanent upgrade to one individual, bought with a blueprint.
#   4. equipment   three fitted items, swapped per match.
#
# Each layer OFFSETS the ones above it. A race is therefore never the whole answer about anybody,
# which is the point — and it is why an individual's sheet is worth reading.
#
# **This file used to be `content/minions/crew.yml` and used to hold `fireman` and `yardhand`,
# which are JOBS rather than kinds of person.** That was the wrong noun and was marked as such in
# three places for a release before it was fixed. A job is something an operation asks for — a
# crew slot — and the same person can do two of them.
#
# ## The stats are fixed, and every archetype declares all of them
#
# Fixed because the simulation's own machinery reads them and needs a number with a meaning
# rather than an absence:
#
#   strength        what they bring to a lever       — Minion#rate_multiplier
#   toughness       what they shrug off              — the Danger Check
#   endurance       how slowly they tire             — Fatigue.accrual
#   intelligence    what they notice                 — wits: gauges, slips, judgement
#   dexterity       how finely they can work         — precision tasks
#   charisma        how others take them             — a boss's authority, allure
#   agility         getting out of the way           — pace, and `avoid`
#   combat_prowess  scraps survived                  — `attack` and `defend`; a trained fighter is 2–3
#
# ## Grudges and temperament
#
# `grudges:` is who this race dislikes, by race or by person, 0..1. Grudges from the race, the
# individual, earlier matches and this one add, then clamp. Temperament is tags in opposed pairs —
# `short_tempered`/`even_tempered`, `callous`/`kindly`, `reckless`/`conscientious`,
# `spiteful`/`forgiving`, `violent_nature`/`gentle`, `annoying`/`calming` — read net. See
# docs/design_sketches/animosity-and-distraction.md.
#
# **`endurance` is 1.0 for a human by definition, and it divides rather than multiplies.** What a
# worker gets done and what it costs them are separate claims: somebody can be strong and short of
# wind. It is also the axis heavy kit is priced against, which is how "this armour tires me"
# becomes something the three equipment slots can say.
#
# ## `mass_kg` is a seventh required field, and it is not a stat
#
# What a body weighs, in kilograms. **Required, with no default**, because it is read by the lift
# limit and by the burden ratio and a quiet 70 kg would be invisible in the content — a race that
# omits it raises at boot.
#
# It is not one of the six because stats pass through `Minion#effective`, which derates them by
# injury: a broken arm would otherwise make somebody lighter. An individual in `content/minions/`
# may offset it — not everybody of a race weighs the same — and that offset is optional, because
# absent means "weighs what their race weighs".
#
# **`mass_kg` is not `hulking`, and neither is derived from the other.** This is weight; `hulking`
# is *dimensions*, and it gates the `wedged` peril because a big frame jams in a narrow roadway. A
# tall thin thing and a dense small thing are different problems.
#
# Anything else goes in `tags:`, which is open on purpose so a new trait costs a line here rather
# than a schema change. See docs/design_sketches/minions.md §4 and
# docs/design_sketches/carrying.md §3.
#
# **`dexterity` does not replace `clumsy`, and the two are not the same statement.** Dexterity is
# how well somebody can do fine work when it goes right; `clumsy` is how often it goes wrong. A
# steady-handed worker who knocks things over is a real person and both numbers describe them.
#
# ## Tags here are a MAP, not a list
#
# Resource tags are a flat list — a thing either is `:liquid` or is not. Minion tags carry a
# value, because "how well can you see in the dark" is a question with a number for an answer.
# `true` is the honest way to write a trait that is simply present.
#
# Values from archetype, individual, training and equipment are **added**, then clamped.
# Consumers multiply what they read. Merge adds, use multiplies — see the sketch §4.

human:
  label: Human
  mass_kg: 70.0
  strength: 1.0
  toughness: 1.0
  endurance: 1.0
  intelligence: 1.0
  dexterity: 1.0
  charisma: 1.0
  agility: 1.0
  combat_prowess: 1.0
  tags: {}

elf:
  label: Elf
  mass_kg: 70.0
  strength: 1.0
  toughness: 0.95
  endurance: 0.85
  intelligence: 1.25
  dexterity: 1.25
  charisma: 1.2
  agility: 1.4
  combat_prowess: 1.3
  tags:
    darkvision: 0.3
    conscientious: 0.2
    keen_eyed: 0.25
    # Fine workers who mend slowly: their wounds heal a little less each match.
    slow_healer: 0.1
  grudges:
    dwarf: 0.2
    orc: 0.75
    goblin: 0.4
#
# **Half a tonne, and that is the interesting number rather than the strength.** `Burden` measures
# a load against the frame shifting it, so an ogre carries several kobolds out of a district at a
# modest cost and nothing can carry an ogre. He is also the only race that cannot be moved by the
# rescue mechanic, which is a real consequence of a real figure rather than a rule.
#
# **No `darkvision`, deliberately.** He needs a lamp like a human does, so five times the strength
# buys nothing at a face nobody has lit — the gate multiplies.
ogre:
  label: Ogre
  mass_kg: 500.0
  # **Below a human's, and that is the whole character of the race.** `strength` is a ratio now,
  # so this says an ogre is worse pound-for-pound than the man beside him — strength grows with
  # cross-section, weight with volume — and is overwhelming anyway because there is half a tonne
  # of him. `force` comes out at 4.6 humans. It is also why nothing can carry an ogre, including
  # another ogre with much to spare, and that is arithmetic rather than a rule.
  strength: 0.75
  toughness: 1.6
  endurance: 1.0
  intelligence: 0.6
  dexterity: 0.5
  charisma: 0.6
  agility: 0.8
  combat_prowess: 1.0
  tags:
    short_tempered: 0.4
    callous: 0.3
    # Valued rather than `true`, and `Peril#weight_for` reads the value: half-way to filling a
    # roadway means wedged half as readily as something that fills it, and still struck by a tub
    # half as often as a kobold would be. Presence alone would make a hob and a giant identical.
    hulking: 0.5
    # Absent-minded and a bit slow rather than the dimmest thing in the world — this is the
    # *mistake* end of the family, where `clumsy` is the *consequence* end.
    boneheaded: 0.25
    clumsy: 0.25

kobold:
  label: Kobold
  mass_kg: 25.0
  strength: 1.0
  toughness: 0.7
  endurance: 1.6
  intelligence: 0.6
  dexterity: 0.8
  charisma: 0.2
  agility: 1.2
  combat_prowess: 0.95
  grudges:
    dwarf: 0.2
    kobold: 0.2
  tags:
    darkvision: 0.5
    clumsy: 0.3
    # **`clumsy` and `boneheaded` are the same family at opposite ends of the causal chain.**
    # Clumsy makes the *bite* worse once something has gone wrong; boneheaded makes the
    # *mistake* likelier in the first place. A kobold at a lever that takes knowing how will
    # occasionally pull the wrong one, which is not the same failing as dropping it.
    boneheaded: 0.5
    # Small enough to sit in a manhole by a trap door all shift, which is what a pit gave its
    # smallest hands. Aids the stations that want somebody little, never the ones that want force.
    diminutive: 0.6
    callous: 0.5
    annoying: 0.3

# Short, dense and built for a pit: tough, strong, sees in the dark, and holds a grudge against
# half the labour market.
dwarf:
  label: Dwarf
  mass_kg: 70.0
  strength: 1.3
  toughness: 1.55
  endurance: 1.25
  intelligence: 1.0
  dexterity: 1.0
  charisma: 0.7
  agility: 0.7
  combat_prowess: 1.2
  tags:
    darkvision: 0.7
    short_tempered: 0.1
    spiteful: 0.3
    diminutive: 0.2
  grudges:
    elf: 0.2
    orc: 0.6
    goblin: 0.6
    kobold: 0.4
    ogre: 0.1
    succubus: 0.1

# Big, strong and quick to anger, and the race a gang full of brawls is made of.
orc:
  label: Orc
  mass_kg: 120.0
  strength: 1.3
  toughness: 1.3
  endurance: 1.3
  intelligence: 0.75
  dexterity: 0.75
  charisma: 0.4
  agility: 0.8
  combat_prowess: 1.2
  tags:
    darkvision: 0.4
    short_tempered: 0.3
    violent_nature: 0.3
    callous: 0.2
  grudges:
    elf: 0.4
    dwarf: 0.4

# **Better than anybody at everything, and the price is everybody else.** `distracting` costs
# whoever works beside her their wits, so the strongest hand in the pit makes the rest of the shift
# blunder.
succubus:
  label: Succubus
  mass_kg: 55.0
  strength: 1.5
  toughness: 1.5
  endurance: 1.5
  intelligence: 1.5
  dexterity: 1.5
  charisma: 1.8
  agility: 1.5
  combat_prowess: 1.5
  tags:
    short_tempered: 0.3
    callous: 0.5
    darkvision: 0.5
    heat_hardened: 0.5
    distracting: 0.7
    annoying: 0.1

goblin:
  label: Goblin
  mass_kg: 50.0
  strength: 1.0
  toughness: 1.0
  endurance: 1.0
  intelligence: 1.1
  dexterity: 1.2
  charisma: 0.7
  agility: 1.1
  combat_prowess: 1.25
  grudges:
    dwarf: 0.4
    elf: 0.2
    kobold: 0.4
  tags:
    short_tempered: 0.2
    darkvision: 0.7
    diminutive: 0.2
    callous: 0.4
    violent_nature: 0.7
