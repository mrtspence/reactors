# Combustion: the reaction the whole game runs on.
#
# `enthalpy_j_per_unit` is per unit of reaction extent, NOT per kilogram of anything. One
# unit of extent consumes the full `consumes` set — so for coal that is 1 kg of coal plus
# 11 kg of air, releasing 30 MJ. Negative is exothermic.
#
# It must ALSO absorb any difference in formation enthalpy between the two sides. The
# stoichiometry itself conserves enthalpy exactly — products inherit what the reactants
# had, split by mass — so this figure is the only place a reaction is allowed to change the
# system's energy. That is what makes combustion a single, ledgerable line rather than a
# leak spread across every parcel.
#
# Mass must balance: the `consumes` ratios and the `produces` ratios sum to the same number,
# and Content refuses to load a reaction where they do not. An unbalanced reaction would
# create matter every time it fired, and it would do so from inside a data file where nobody
# would think to look when the conservation spec started failing.
#
# `min_temperature_k` is the temperature at which the fire GAINS ground rather than losing
# it — above it the flame front spreads across the grate, below it the fire dies back. It is
# not a gate on the reaction: an ember keeps burning below it while it fades, which is what
# lets a dying fire be nursed back instead of being switched off.
#
# That is what the `ignition:` block below buys. Ignition used to be modelled on the node's
# BULK temperature, which a lumped-temperature node cannot represent honestly — a match does
# not raise a firebox to 700 K, it raises a few grams. Modelled as a bulk threshold the fire
# was all-or-nothing: above the line the whole grate burned, below it nothing did and nothing
# ever could again, so the only winning move was to leave the igniter on permanently.
#
#   spread_per_s   how fast burning fuel lights its neighbours, while sustaining
#   quench_per_s   how fast it dies back when too cold, or starved of air
#
# Spread is logistic, so it is fastest with half the grate alight and tails off as it runs out
# of fresh fuel to reach — and from exactly zero it stays at zero. A fire needs a spark.
#
# A reaction with no `ignition:` block is unaffected: it keeps the old bulk-temperature gate.
#
# Air starvation needs no special handling. The reaction rate is limited by whichever
# reagent runs out first, so closing the damper chokes the fire through exactly the same
# code path that an empty fuel bunker does.
#
# ## `rate_per_s` changed meaning when ignition landed, and it was not re-tuned
#
# It used to cap the reaction at the *available reagents*, and with air almost always the
# limiting one it meant "how much of the draught blowing past gets burnt". You wanted it high:
# at 0.8 a firebox starved in the middle of a full grate because air blew through unreacted.
# Coal sat at **6.0** for that reason.
#
# Ignition capped the fuel term at the mass actually ALIGHT, and the same number silently
# became "how fast lit fuel is consumed" — where 6.0/s means 78% of the fire disappears every
# tick. Lit mass could then never accumulate: it burned away faster than `spread_per_s` could
# grow it, so the fire sat pinned at ~0.12 kg alight while `oxidiser_demand` — computed from
# that same rate — asked for **1 kg of air per tick** to sustain it. Everything downstream
# read as air starvation, and it was tuned around for a long time (a 25 m³ firebox, an 8 kPa
# blower) before anyone measured the fire itself.
#
# Measured, at the original geometry with a 600 Pa blower — boiler pressure after 4000 ticks:
#
#     rate  0.5  fire dies      rate  1.5  605 kPa, 110 rpm
#     rate  0.7  168 kPa        rate  1.8  607 kPa, 110 rpm
#     rate  1.0  298 kPa        rate  2.0  600 kPa, 110 rpm
#                               rate  2.5  fire dies
#
# **It is sharply peaked, and both cliffs are failures rather than degradations.** Too slow and
# the fire cannot heat the box faster than the boiler drains it; too fast and the lit mass
# outruns spread and goes out. The plateau is 1.5–2.0 and these values sit in the middle of it.
# If you change `spread_per_s`, `quench_per_s` or the firebox geometry, re-measure this — a
# number that only works on a plateau is a number that will drift off one.

coal_combustion:
  consumes: { coal: 1.0, air: 11.0 }
  produces: { flue_gas: 11.9, ash: 0.1 }
  enthalpy_j_per_unit: -30000000
  # How fast LIT fuel is consumed. Read the note at the top of this file before touching it —
  # the meaning of this number changed when ignition landed and it is now sharply peaked.
  rate_per_s: 1.5
  min_temperature_k: 500       # coal wants real heat before a flame front will travel
  ignition:
    # Slow to take hold and slow to let go — a coal fire is banked overnight and still there
    # in the morning, which is the behaviour that makes it forgiving to run.
    #
    # `quench_per_s` exceeds `spread_per_s` so that a cold enough box can kill a fire outright.
    # In practice it rarely will: at ambient the chill term only cancels about half the spread,
    # so the fire establishes about three times slower in a cold firebox than a hot one rather
    # than failing to establish at all. Coal dies from a shut damper, not from a cold grate,
    # and that is the failure worth making a player see coming.
    spread_per_s: 0.30
    quench_per_s: 0.45

wood_combustion:
  consumes: { wood: 1.0, air: 6.0 }
  produces: { flue_gas: 6.97, ash: 0.03 }
  enthalpy_j_per_unit: -16000000
  rate_per_s: 2.2              # catches faster and burns away faster than coal
  min_temperature_k: 400       # and lights far more easily, which matters at startup
  ignition:
    # Catches readily and dies readily. Kindling: the reason you light a coal fire with wood.
    spread_per_s: 0.80
    quench_per_s: 0.70

oil_combustion:
  consumes: { fuel_oil: 1.0, air: 14.0 }
  produces: { flue_gas: 15.0 }
  enthalpy_j_per_unit: -42000000
  rate_per_s: 3.5
  min_temperature_k: 430
  ignition:
    # A sprayed liquid fuel takes the whole burner almost at once and goes out just as fast
    # when the flame is lost — which is why oil burners have flame detectors and coal grates
    # do not.
    spread_per_s: 1.60
    quench_per_s: 1.20

# **Firedamp, and it is not a fire — it is an explosion.**
#
# Everything above is a reaction you keep going on purpose. This one is the same machinery
# pointed the other way: you spend the whole match making sure it never starts, and the
# parameters are chosen so that if it does, it is already too late.
#
# 55.5 MJ/kg — nearly twice coal by weight — and it consumes 17.2 kg of air per kilogram, which
# is why a gassy working also becomes an airless one. The heat is not the point; the volume is.
firedamp_combustion:
  consumes: { firedamp: 1.0, air: 17.2 }
  produces: { flue_gas: 18.2 }
  enthalpy_j_per_unit: -55500000
  # An order of magnitude faster than any fuel bed. A gas explosion is not a fire spreading
  # across a grate — it is a flame front crossing a district faster than anybody in it can
  # move, and `rate_per_s` is the only place that difference lives.
  rate_per_s: 18.0
  # Methane's autoignition is ~810 K, but what sets a firedamp explosion off is never the bulk
  # temperature of a roadway — it is a naked light, a shot, or a spark off a signal wire. That
  # is what the `ignition:` block below represents, and it is why this figure is low enough for
  # a flame already present to carry: above it the front gains ground, below it the mixture
  # will not carry one at all.
  min_temperature_k: 600
  ignition:
    # **Almost pure spread and almost no quench**, which is the opposite of every fuel above.
    # A coal fire is forgiving because it is slow in both directions; firedamp is unforgiving
    # because once a flame is in it there is nothing left to do. The asymmetry IS the hazard.
    spread_per_s: 9.00
    quench_per_s: 0.20
    # **The explosive range, and the reason a pit is not permanently alight.** Methane carries
    # a flame between about 5% and 15% by volume and does nothing at all either side. Below the
    # lean figure a naked light burns calmly in gas a lamp can already read — which is what
    # makes the flame cap worth looking at — and an ignition goes out when it has burnt the
    # mixture back down through it, rather than settling in to burn every kilogram that seeps
    # in afterwards.
    lean_fraction: 0.05
    rich_fraction: 0.15
  # **A gas explosion in a working with the air already used up does not go out — it goes
  # wrong.** Methane burnt with three-quarters of the oxygen it wants makes carbon monoxide
  # instead of carbon dioxide, which is why the survivors of a firedamp ignition in a badly
  # ventilated district were so often killed by what came after rather than by the blast.
  limited_by: air
  alternatives:
    # CH4 + 1.5 O2 rather than 2 O2, so three-quarters of the air and 1.75 kg of CO per
    # kilogram of gas. Leaves about two-thirds of the heat behind: what is not released is the
    # 10.1 MJ per kilogram of CO that a complete burn would have got by taking the second
    # oxygen.
    - consumes: { firedamp: 1.0, air: 12.9 }
      produces: { flue_gas: 12.15, whitedamp: 1.75 }
      enthalpy_j_per_unit: -37800000

# **The one that kills everybody.**
#
# Firedamp is dangerous; coal dust is what makes a firedamp ignition a disaster. The gas burns
# in whatever volume held it, and that is bad enough — the dust is lying along every roadway in
# the mine, gets raised by the blast ahead of the flame, and carries the fire the whole length
# of the workings. Courrières, 1906: 1,099 dead. Senghenydd, 1913: 439.
#
# Less energetic than methane per kilogram and there is **far more of it**, which is why the
# figures here are a lower enthalpy and a comparable rate.
coal_dust_combustion:
  consumes: { coal_dust: 1.0, air: 9.0 }
  produces: { flue_gas: 9.9, ash: 0.1 }
  enthalpy_j_per_unit: -24000000
  rate_per_s: 14.0
  # Lower than firedamp's: a dust cloud is easier to light than the gas is, which is precisely
  # why an ignition that starts in gas does not stay there.
  min_temperature_k: 480
  ignition:
    # Spreads nearly as hard as firedamp and lets go almost as reluctantly. A dust explosion
    # does not go out, it runs out of roadway.
    spread_per_s: 7.50
    quench_per_s: 0.30
    # **A dust explosion runs out of cloud, not out of roadway.** Coal dust needs roughly
    # 50 g/m³ suspended to propagate at all; thinner than that and the flame cannot reach the
    # next particle. Expressed as a volume share like every other fuel, which for a solid at
    # 800 kg/m³ is a very small number and still the same idea — 0.05 ÷ 800.
    #
    # No rich limit. There is no such thing as a coal dust cloud too thick to burn in any
    # roadway anybody would survive being in.
    lean_fraction: 0.0000625
  # **And this is the one that made the rescue parties turn back.** A dust explosion consumes
  # the air of the whole length it runs, so most of it burns in air it has already spent —
  # carbon to CO rather than CO2, which is nine kilojoules a gram instead of thirty-three.
  limited_by: air
  alternatives:
    # Carbon taking one oxygen instead of two: a little over half the air, 2.3 kg of CO per
    # kilogram of dust, and barely a quarter of the heat.
    - consumes: { coal_dust: 1.0, air: 5.0 }
      produces: { flue_gas: 3.6, whitedamp: 2.3, ash: 0.1 }
      enthalpy_j_per_unit: -6700000
