# Combustion: the reaction the whole game runs on.
#
# `enthalpy_j_per_unit` is per unit of reaction extent, NOT per kilogram of anything. One
# unit of extent consumes the full `consumes` set — so for coal that is 1 kg of coal plus
# 11 kg of air, releasing 30 MJ. Negative is exothermic.
#
# It must ALSO absorb any difference in formation enthalpy between the two sides. The
# stoichiometry itself conserves enthalpy exactly — products inherit what the reactants
# had, split by mass — so this figure is the only place a reaction is allowed to change the
# system's energy. That is what makes combustion a single, ledgerable line rather than a
# leak spread across every parcel.
#
# Mass must balance: the `consumes` ratios and the `produces` ratios sum to the same number,
# and Content refuses to load a reaction where they do not. An unbalanced reaction would
# create matter every time it fired, and it would do so from inside a data file where nobody
# would think to look when the conservation spec started failing.
#
# `min_temperature_k` is the temperature at which the fire GAINS ground rather than losing
# it — above it the flame front spreads across the grate, below it the fire dies back. It is
# not a gate on the reaction: an ember keeps burning below it while it fades, which is what
# lets a dying fire be nursed back instead of being switched off.
#
# That is what the `ignition:` block below buys. Ignition used to be modelled on the node's
# BULK temperature, which a lumped-temperature node cannot represent honestly — a match does
# not raise a firebox to 700 K, it raises a few grams. Modelled as a bulk threshold the fire
# was all-or-nothing: above the line the whole grate burned, below it nothing did and nothing
# ever could again, so the only winning move was to leave the igniter on permanently.
#
#   spread_per_s   how fast burning fuel lights its neighbours, while sustaining
#   quench_per_s   how fast it dies back when too cold, or starved of air
#
# Spread is logistic, so it is fastest with half the grate alight and tails off as it runs out
# of fresh fuel to reach — and from exactly zero it stays at zero. A fire needs a spark.
#
# A reaction with no `ignition:` block is unaffected: it keeps the old bulk-temperature gate.
#
# Air starvation needs no special handling. The reaction rate is limited by whichever
# reagent runs out first, so closing the damper chokes the fire through exactly the same
# code path that an empty fuel bunker does.

coal_combustion:
  consumes: { coal: 1.0, air: 11.0 }
  produces: { flue_gas: 11.9, ash: 0.1 }
  enthalpy_j_per_unit: -30000000
  # Fast. A firebox burns most of the air it is given within a second — set too slow, the
  # draught blows through unreacted and the fire starves in the middle of a full grate.
  rate_per_s: 6.0
  min_temperature_k: 500       # coal wants real heat before a flame front will travel
  ignition:
    # Slow to take hold and slow to let go — a coal fire is banked overnight and still there
    # in the morning, which is the behaviour that makes it forgiving to run.
    #
    # `quench_per_s` exceeds `spread_per_s` so that a cold enough box can kill a fire outright.
    # In practice it rarely will: at ambient the chill term only cancels about half the spread,
    # so the fire establishes about three times slower in a cold firebox than a hot one rather
    # than failing to establish at all. Coal dies from a shut damper, not from a cold grate,
    # and that is the failure worth making a player see coming.
    spread_per_s: 0.30
    quench_per_s: 0.45

wood_combustion:
  consumes: { wood: 1.0, air: 6.0 }
  produces: { flue_gas: 6.97, ash: 0.03 }
  enthalpy_j_per_unit: -16000000
  rate_per_s: 9.0              # catches faster and burns away faster than coal
  min_temperature_k: 400       # and lights far more easily, which matters at startup
  ignition:
    # Catches readily and dies readily. Kindling: the reason you light a coal fire with wood.
    spread_per_s: 0.80
    quench_per_s: 0.70

oil_combustion:
  consumes: { fuel_oil: 1.0, air: 14.0 }
  produces: { flue_gas: 15.0 }
  enthalpy_j_per_unit: -42000000
  rate_per_s: 14.0
  min_temperature_k: 430
  ignition:
    # A sprayed liquid fuel takes the whole burner almost at once and goes out just as fast
    # when the flame is lost — which is why oil burners have flame detectors and coal grates
    # do not.
    spread_per_s: 1.60
    quench_per_s: 1.20
