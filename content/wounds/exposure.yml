# Wounds from cold and from bad air, both continuous: one standing wound deepens for as long as
# somebody stays in it. Examples to be rewritten. The shape is described in blunt.yml.

cold:
  minor:
    numb_fingers: { label: Numb fingers, weight: 1, derates: { dexterity: 0.85 } }
    shivering: { label: Shivering, weight: 1, derates: { dexterity: 0.9, strength: 0.95 } }
    chilblains: { label: Chilblains, weight: 1, derates: { agility: 0.9 } }
  significant:
    frostnip: { label: Frostnip, weight: 1, derates: { dexterity: 0.6 } }
    chilled_to_the_bone: { label: Chilled to the bone, weight: 1, derates: { strength: 0.7, endurance: 0.7 } }
    frozen_feet: { label: Frozen feet, weight: 1, derates: { agility: 0.55 } }
  severe:
    frostbite: { label: Frostbite, weight: 1, derates: { dexterity: 0.15, strength: 0.6 } }
    hypothermia: { label: Hypothermia, weight: 1, derates: { intelligence: 0.4, endurance: 0.2 } }
    frostbitten_feet: { label: Frostbitten feet, weight: 1, derates: { agility: 0.15 } }
  mortal:
    frozen_to_death: { label: Frozen to death, weight: 1, derates: { endurance: 0.0 } }
    killed_by_the_cold: { label: Killed by the cold, weight: 1, derates: { endurance: 0.0, intelligence: 0.0 } }
    frozen_solid: { label: Frozen solid, weight: 1, derates: { strength: 0.0, agility: 0.0 } }

breath:
