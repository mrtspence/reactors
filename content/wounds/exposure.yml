  significant:
    gasping: { label: Gasping, weight: 1, derates: { endurance: 0.55, strength: 0.8 } }
    confused: { label: Confused, weight: 1, derates: { intelligence: 0.55 } }
    staggering: { label: Staggering, weight: 1, derates: { agility: 0.5, dexterity: 0.7 } }
  severe:
    overcome: { label: Overcome, weight: 1, derates: { endurance: 0.1, intelligence: 0.2 } }
    unconscious: { label: Unconscious, weight: 1, derates: { intelligence: 0.0, agility: 0.0 } }
    choking: { label: Choking, weight: 1, derates: { endurance: 0.1, strength: 0.3 } }
  mortal:
    suffocated: { label: Suffocated, weight: 1, derates: { endurance: 0.0 } }
    choked_to_death: { label: Choked to death, weight: 1, derates: { endurance: 0.0, intelligence: 0.0 } }
    drowned: { label: Drowned, weight: 1, derates: { endurance: 0.0 } }
