# Wounds from fire, from steam and boiling water — all of them `burn` — and from standing too long
# in a hot place.
# Examples to be rewritten. The shape is described in blunt.yml.
#
# `heat` is a continuous kind: one standing wound deepens while somebody stays in the heat, so its
# tiers are one condition growing rather than separate accidents.

burn:
  minor:
    scalded_skin: { label: Scalded skin, weight: 1, derates: { intelligence: 0.95, charisma: 0.95 } }
    singed_hands: { label: Singed hands, weight: 1, derates: { dexterity: 0.9 } }
    blistered_arm: { label: Blistered arm, weight: 1, derates: { strength: 0.95, dexterity: 0.95 } }
    singed_eyebrows: { label: Singed eyebrows, weight: 1, derates: { charisma: 0.9 } }
    steam_burned_feet: { label: Steam-burned feet, weight: 1, derates: { agility: 0.9 } }
  significant:
    burned_hands: { label: Burned hands, weight: 1, derates: { dexterity: 0.45, combat_prowess: 0.8 } }
    burned_face: { label: Burned face, weight: 1, derates: { charisma: 0.6, intelligence: 0.8 } }
    burned_back: { label: Burned back, weight: 1, derates: { strength: 0.7, endurance: 0.75 } }
    scalded_legs: { label: Scalded legs, weight: 1, derates: { agility: 0.5 } }
    scalded_arms: { label: Scalded arms, weight: 1, derates: { strength: 0.7, dexterity: 0.6 } }
  severe:
    charred_hands: { label: Charred hands, weight: 1, derates: { dexterity: 0.1, strength: 0.6 } }
    burned_eyes: { label: Burned eyes, weight: 1, derates: { intelligence: 0.4, dexterity: 0.3 } }
    burned_over_the_body: { label: Burned over the body, weight: 1, derates: { endurance: 0.2, strength: 0.4, agility: 0.5 } }
    scalded_to_the_waist: { label: Scalded to the waist, weight: 1, derates: { agility: 0.2, endurance: 0.4 } }
    boiled_hands: { label: Boiled hands, weight: 1, derates: { dexterity: 0.1, strength: 0.6 } }
  mortal:
    burned_alive: { label: Burned alive, weight: 1, derates: { endurance: 0.0 } }
    charred: { label: Charred, weight: 1, derates: { strength: 0.0, agility: 0.0 } }
    seared_lungs: { label: Seared lungs, weight: 1, derates: { endurance: 0.05 } }
    boiled_alive: { label: Boiled alive, weight: 1, derates: { endurance: 0.0 } }
