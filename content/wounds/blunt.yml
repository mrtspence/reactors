# Wounds from being struck and from being crushed. Examples to be rewritten.
#
# ## The shape
#
# `kind → tier → variant`. Every kind declares all four tiers (`minor`, `significant`, `severe`,
# `mortal`) and every tier exactly five variants, each a `label`, a `weight` (how often it is the
# one picked against the others of its tier) and `derates`: stats it multiplies while carried, 0..1,
# naming only stats. Refused at boot otherwise. See docs/design_sketches/wounds.md.
#
# **A variant's place in its tier matters**: a wound that heals or deepens across a tier becomes the
# variant in the same place in the next, so the first of each tier should be the same injury
# getting better or worse where it can be.

impact:
  minor:
    knocked_out_tooth: { label: Knocked-out tooth, weight: 1, derates: { charisma: 0.95 } }
    black_eye: { label: Black eye, weight: 1, derates: { intelligence: 0.975, dexterity: 0.975, charisma: 0.975 } }
    bruised_ribs: { label: Bruised ribs, weight: 1, derates: { endurance: 0.95, strength: 0.975 } }
    jammed_wrist: { label: Jammed wrist, weight: 1, derates: { dexterity: 0.95, strength: 0.975 } }
    contusion: { label: Contusion, weight: 1, derates: { agility: 0.95, endurance: 0.975 } }
  significant:
    concussion: { label: Concussion, weight: 1, derates: { intelligence: 0.7, dexterity: 0.8, agility: 0.8 } }
    broken_nose: { label: Broken nose, weight: 1, derates: { endurance: 0.7, charisma: 0.7 } }
    cracked_ribs: { label: Cracked ribs, weight: 1, derates: { endurance: 0.6, strength: 0.75 } }
    busted_elbow: { label: Busted elbow, weight: 1, derates: { dexterity: 0.6, strength: 0.75 } }
    hairline_fracture: { label: Hairline fracture, weight: 1, derates: { agility: 0.65, endurance: 0.7 } }
  severe:
    fractured_skull: { label: Fractured skull, weight: 1, derates: { intelligence: 0.3, dexterity: 0.4, agility: 0.5 } }
    broken_jaw: { label: Broken jaw, weight: 1, derates: { endurance: 0.5, charisma: 0.3 } }
    stove_in_chest: { label: Stove-in chest, weight: 1, derates: { endurance: 0.25, strength: 0.4 } }
    shattered_humerus: { label: Shattered humerus, weight: 1, derates: { dexterity: 0.3, strength: 0.4 } }
    cracked_femur: { label: Cracked femur, weight: 1, derates: { agility: 0.15, endurance: 0.6 } }
  mortal:
    crushed_skull: { label: Crushed skull, weight: 1, derates: { intelligence: 0.05, dexterity: 0.05, agility: 0.05 } }
    broken_neck: { label: Broken neck, weight: 1, derates: { strength: 0.05, agility: 0.05 } }
    burst_organs: { label: Burst organs, weight: 1, derates: { endurance: 0.05, strength: 0.1 } }
    caved_in_chest: { label: Caved-in chest, weight: 1, derates: { endurance: 0.05, strength: 0.05 } }
    bleeding_on_the_brain: { label: Bleeding on the brain, weight: 1, derates: { intelligence: 0.0, agility: 0.05 } }

